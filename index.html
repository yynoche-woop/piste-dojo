<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>フェンシング日和</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* 上に奥行きのある競技場(5枚の層がカメラに合わせてずれる)、採点器と審判の解説。操作ボタンは画面下に固定。暗い会場の世界観で固定 */
:root{
  --stage:#080b10; --panel:#111720; --panel2:#18202b; --hair:#253040; --hair2:#34414f;
  --ink:#f1f4f7; --muted:#b4bec8; --white:#ffffff;
  --trail-me:#9eeeff; --trail-cpu:#ff74d4; --lamp-red:#ff2e2e; --lamp-green:#22e06a; --led:#ff4a35;
  --stagelight:#3d6dff; --line:#c46f3f; --gold:#ffd25a;
  /* Windowsはメイリオ、Mac・iPhoneは形の近いヒラギノ角ゴ、AndroidはNoto Sans JP */
  --body:"Meiryo","メイリオ","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"Consolas",monospace;
  color-scheme:dark;
}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;
  line-break:strict;overflow-wrap:break-word;}
.pb{word-break:keep-all}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-block:12px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
h1{font-weight:700;font-size:24px;margin:0;line-height:1.3;color:var(--white)}
.sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--hair2);background:var(--panel);color:var(--muted);
  border-radius:999px;padding:4px 14px;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.wdesc{font-size:14px;color:var(--muted)}
.wdesc b{color:var(--ink)}

/* 競技場 */
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--hair);background:#05070a}
.stage svg{display:block;width:100%;height:auto}
.layer{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fencer{transition:transform .35s ease}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-18px)}}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw .42s ease-out forwards, fade 1.6s .9s ease-in forwards}
.spark{animation:fade 1.4s .5s ease-in forwards}
.tech{font-weight:700;font-size:18px;animation:fade 2.2s 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
.call{font-weight:700;font-size:24px;fill:var(--white)}
.tag{font-size:13px;font-weight:700;fill:var(--muted)}
.tag.me{fill:var(--trail-me)} .tag.cpu{fill:var(--trail-cpu)}
.ptag{font-size:11px;fill:#9aa6b2}
#prioMark{font-size:13px;font-weight:700;fill:var(--gold);transition:opacity .3s}
.toast{position:absolute;left:10px;right:10px;bottom:8px;text-align:center;font-weight:700;font-size:16px;line-height:1.5;
  color:var(--white);background:rgba(0,0,0,.62);border-radius:8px;padding:4px 10px}
.toast:empty{display:none}

/* 採点器 */
.box{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  background:#000;border:1px solid var(--hair2);border-radius:10px;padding:8px 14px}
.side{display:flex;align-items:center;gap:8px}
.side.r{justify-content:flex-end}
.lamps{display:flex;gap:5px;align-items:center}
.lamp{width:36px;height:26px;border-radius:4px;background:#1c2026;flex:none;transition:background .12s,box-shadow .12s}
.lamp.w{width:16px}
.lamp.red.lit{background:var(--lamp-red);box-shadow:0 0 22px var(--lamp-red)}
.lamp.green.lit{background:var(--lamp-green);box-shadow:0 0 22px var(--lamp-green)}
.lamp.w.lit{background:#fff;box-shadow:0 0 18px #fff}
.who{font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.led{font-family:var(--mono);font-size:36px;line-height:1;color:var(--led);text-shadow:0 0 10px rgba(255,74,53,.55);font-variant-numeric:tabular-nums}
.mid{text-align:center;font-size:13px;color:var(--muted);line-height:1.5}
.mid .led{font-size:20px;display:block}
.cards{font-size:12px;color:var(--gold)}

/* 審判 */
.ref{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:12px 16px}
.ref .log{font-size:14px;color:var(--muted)}
.ref h2{font-weight:700;font-size:20px;margin:2px 0 4px;text-wrap:balance;color:var(--white);display:flex;gap:10px;align-items:baseline}
.ref h2 svg{width:15px;height:15px;flex:none;transform:translateY(1px)}
.ref p{margin:0;font-size:16px}
.ref .rule{margin-top:10px;font-size:15px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.ref .rule em{font-style:normal;font-size:13px;font-weight:700;color:var(--trail-me);display:block}

/* ルール帳(折りたたみ) */
.book{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:0 14px}
.book summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:700;font-size:16px}
.book summary::-webkit-details-marker{display:none}
.book summary::after{content:"開く";font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.book[open] summary::after{content:"閉じる"}
.book summary .cnt{font-family:var(--mono);color:var(--muted);margin-left:auto}
.book ul{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.book li{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.7}
.book li b{display:block;font-size:16px;color:var(--white)}
.book li.locked{color:var(--muted);background:transparent;border:1px dashed var(--hair2)}
.book li.locked b{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}

/* 操作パネル:画面下に固定して親指で押せるように */
.dock{position:sticky;bottom:0;z-index:5;margin-top:4px;background:rgba(8,11,16,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--hair);
  padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.hint{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hint .k{font-size:12px;font-weight:700;color:#14060f;background:var(--trail-cpu);border-radius:6px;padding:0 7px;white-space:nowrap}
.hint #hint{font-size:16px;font-weight:700;flex:1 1 180px}
.hint .d{font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap}
.hint .prio{font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 7px}
.hint .prio.none{border-color:var(--hair2);color:var(--muted)}

.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts.sub{grid-template-columns:repeat(3,1fr)}
.act{font:inherit;color:var(--ink);cursor:pointer;min-width:0;min-height:68px;border-radius:14px;
  border:1px solid #3d4a5b;background:linear-gradient(#2a3442,#1a212b);
  box-shadow:0 4px 0 #06080b, inset 0 1px 0 rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 4px;
  transition:transform .06s, box-shadow .06s, filter .15s}
.act svg{width:20px;height:20px}
.act b{font-size:18px;font-weight:700;white-space:nowrap}
.act span{font-size:12px;color:var(--muted);white-space:nowrap}
.acts.sub .act{min-height:50px;flex-direction:row;gap:6px;border-radius:12px}
.acts.sub .act b{font-size:15px}
.acts.sub .act span{font-size:11px}
.act:hover{filter:brightness(1.15)}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #06080b, inset 0 1px 0 rgba(255,255,255,.08)}
.act.atk{border-color:#7a2e2a;background:linear-gradient(#5a2320,#341413)}
.act.atk b{color:#ffd9d5}
.act.par{border-color:#25607a;background:linear-gradient(#1d4659,#112834)}
.act.par b{color:#d8f6ff}
.act.spc{border-color:#5b4a26;background:linear-gradient(#3a3020,#221c12)}
.act.spc b{color:#ffe7b0}
.act.foul span{color:#ff9a8f}
.act:focus-visible,.tab:focus-visible,.next:focus-visible{outline:3px solid var(--trail-me);outline-offset:3px}
.act:disabled{opacity:.4;cursor:default;transform:none}
@media (max-width:520px){.act b{font-size:16px}.acts.sub .act{flex-direction:column;gap:0}.acts.sub .act b{font-size:14px}}

.next{font:inherit;width:100%;border-radius:14px;cursor:pointer;color:#06222b;
  border:1px solid #bff5ff;background:linear-gradient(#bff5ff,#7fdcf5);box-shadow:0 5px 0 #2a6b7d;
  padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .06s, box-shadow .06s}
.next b{font-size:22px;font-weight:700}
.next span{font-size:14px;color:#1c4a57}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 #2a6b7d}
@media (prefers-reduced-motion:reduce){.layer,.fencer,.lamp,.act,.next{transition:none}.drift{animation:none}.trail{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>フェンシング日和</h1>
      <div class="sub pb">突いて、<wbr>受けて、<wbr>ときどき<wbr>負けながら、<wbr>ルールを<wbr>覚える。</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" data-w="epee" aria-selected="true">エペ</button>
      <button class="tab" role="tab" data-w="foil" aria-selected="false">フルーレ</button>
      <button class="tab" role="tab" data-w="sabre" aria-selected="false">サーブル</button>
    </div>
  </header>
  <div class="wdesc pb" id="wdesc"></div>

  <div class="stage">
    <svg id="arena" viewBox="0 0 700 300" role="img" aria-label="競技場とピスト上の2人の選手">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="near"><feGaussianBlur stdDeviation="3"/></filter>
        <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d8dc"/><stop offset="1" stop-color="#8d939a"/></linearGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05070a"/></linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b84ff" stop-opacity=".35"/><stop offset="1" stop-color="#5b84ff" stop-opacity="0"/></linearGradient>
      </defs>
      <!-- 層0:天井と照明(いちばん遠い) -->
      <g id="L0" class="layer"><g class="drift">
        <rect x="-400" y="0" width="1500" height="300" fill="url(#wall)"/>
        <g id="beams"></g>
        <g id="lights" filter="url(#soft)" fill="var(--stagelight)"></g>
      </g></g>
      <!-- 層1:観客席 -->
      <g id="L1" class="layer"><g id="crowd"></g></g>
      <!-- 層2:奥のスクリーン枠 -->
      <g id="L2" class="layer">
        <rect x="-400" y="150" width="1500" height="2" fill="#1f2a38"/>
        <rect x="-400" y="196" width="1500" height="44" fill="#0a0e14"/>
        <g id="panels"></g>
      </g>
      <!-- 層3:ピストと選手(カメラの中心) -->
      <g id="L3" class="layer"><g transform="translate(0,40)">
        <rect x="-500" y="214" width="1700" height="60" fill="#06080b"/>
        <polygon points="14,196 686,196 700,214 0,214" fill="url(#deck)"/>
        <rect x="0" y="214" width="700" height="4" fill="#41464c"/>
        <g stroke="var(--line)" stroke-width="2.5">
          <line x1="350" y1="196" x2="350" y2="214"/>
          <line x1="256" y1="196" x2="254" y2="214"/>
          <line x1="444" y1="196" x2="446" y2="214"/>
          <line x1="114" y1="196" x2="108" y2="214" opacity=".7"/>
          <line x1="586" y1="196" x2="592" y2="214" opacity=".7"/>
          <line x1="21" y1="196" x2="7" y2="214" stroke-width="3.5"/>
          <line x1="679" y1="196" x2="693" y2="214" stroke-width="3.5"/>
        </g>
        <g class="ptag" text-anchor="middle">
          <text x="350" y="234">中央線</text><text x="255" y="234">構えの線</text><text x="445" y="234">構えの線</text>
          <text x="60" y="234">後方2m</text><text x="640" y="234">後方2m</text>
        </g>
        <g id="fMe" class="fencer"></g><g id="fCpu" class="fencer"></g>
        <text id="tagMe" class="tag me" y="66" text-anchor="middle">あなた</text>
        <text id="tagCpu" class="tag cpu" y="66" text-anchor="middle">相手</text>
        <text id="prioMark" y="48" text-anchor="middle" opacity="0">▼ 優先権</text>
        <g id="fx"></g>
      </g></g>
      <!-- 層4:手前のぼけたケーブル(いちばん近い) -->
      <g id="L4" class="layer" filter="url(#near)">
        <line x1="-60" y1="232" x2="190" y2="308" stroke="#e8ecf0" stroke-width="5" opacity=".75"/>
        <circle cx="190" cy="306" r="9" fill="#e8ecf0" opacity=".8"/>
        <rect x="430" y="286" width="420" height="30" rx="10" fill="#0e131a"/>
      </g>
      <text id="call" class="call" x="350" y="68" text-anchor="middle">アン・ガルド</text>
      <g id="hud"></g>
    </svg>
    <div class="toast pb" id="toast"></div>
  </div>

  <div class="box" aria-live="polite">
    <div class="side"><div class="lamps"><div class="lamp red" id="lampMe"></div><div class="lamp w" id="whiteMe" hidden></div></div><div><div class="who">あなた</div><div class="led" id="sMe">0</div></div></div>
    <div class="mid"><span class="led" id="turnNo">01</span>5本先取<div class="cards" id="cards"></div></div>
    <div class="side r"><div style="text-align:right"><div class="who">相手</div><div class="led" id="sCpu">0</div></div><div class="lamps"><div class="lamp w" id="whiteCpu" hidden></div><div class="lamp green" id="lampCpu"></div></div></div>
  </div>

  <section class="ref" id="ref"></section>

  <details class="book">
    <summary><span id="bookTitle">覚えたルール</span><span class="cnt" id="bookCount"></span></summary>
    <ul id="book"></ul>
  </details>
  <p class="note pb">モック版です。<wbr>相手の気配は<wbr>7割の確率で<wbr>本当の動きを<wbr>示します。<wbr>間合いは<wbr>1m単位、<wbr>優先権は<wbr>「相手より<wbr>先に<wbr>前へ出て<wbr>攻め始めた側」に<wbr>簡略化しています。</p>

  <div class="dock">
    <div class="hint"><span class="k">相手の気配</span><span id="hint" class="pb"></span><span class="prio none" id="prio" hidden></span><span class="d" id="dist"></span></div>
    <div class="acts" id="acts1">
      <button class="act" data-a="adv"><svg viewBox="0 0 22 22"><path d="M6 4l10 7-10 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><b>前進</b><span>1m 詰める</span></button>
      <button class="act" data-a="ret"><svg viewBox="0 0 22 22"><path d="M16 4L6 11l10 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><b>後退</b><span>1m 下がる</span></button>
      <button class="act atk" data-a="atk"><svg viewBox="0 0 22 22"><path d="M2 11h17M14 6l5 5-5 5" fill="none" stroke="#ffb3ab" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="atkName">突き</b><span>3m まで</span></button>
      <button class="act par" data-a="par"><svg viewBox="0 0 22 22"><path d="M5 17C3 9 9 3 17 5" fill="none" stroke="#bdefff" stroke-width="2.4" stroke-linecap="round"/><path d="M13 3l4 2-2 4" fill="none" stroke="#bdefff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>パラード</b><span>受けて反撃</span></button>
    </div>
    <div class="acts sub" id="acts2">
      <button class="act spc" data-a="fei"><b>フェイント</b><span>パラードを誘う</span></button>
      <button class="act spc" data-a="fle" id="fleBtn"><b>フレッシュ</b><span id="fleSub">5m まで</span></button>
      <button class="act spc" data-a="cnt"><b>カウンター</b><span>攻撃に合わせる</span></button>
    </div>
    <button class="next" id="next" hidden></button>
  </div>
</div>

<script>
const t = s => `<span class="pb">${s.split('|').join('<wbr>').replace(/{(.+?)}/g,'<span style="white-space:nowrap">$1</span>')}</span>`;
const X = m => 350 + m * 47;           // ピスト上の位置(m)→ 画面のx座標
const START = 2, END = 7, FLOOR = 196;
const NS = 'http://www.w3.org/2000/svg';
const COL = {me:'var(--trail-me)', cpu:'var(--trail-cpu)'};
const NAME = {me:'あなた', cpu:'相手'};
const other = s => s === 'me' ? 'cpu' : 'me';
const TRI = c => `<svg viewBox="0 0 14 14"><path d="M1 2h12L7 13z" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
// 層ごとの動く割合(カメラが1動くと、遠い層ほど少しだけ動く)
const DEPTH = {L0:.15, L1:.35, L2:.6, L3:1, L4:1.6};

const RULES = {
  maai:  ['間合い', '攻撃が|届くのは|およそ|3mまで。|遠い|ところから|仕掛けても|届きません。'],
  parry: ['パラード・リポスト', '相手の|剣を|払って(パラード)、|すぐ|突き返す(リポスト)と|1本。|ただし|払い損ねる|ことも|あります。'],
  feint: ['フェイント', '攻撃する|ふりで|相手の|パラードを|誘い、|空いた|ところを|攻める技。|パラードばかりだと|これに|やられます。'],
  fleche:['フレッシュ', '走り込んで|遠くから|攻める技。|エペと|フルーレでは|使えますが、|サーブルでは|禁止です。'],
  counter:['カウンター', '相手の|攻撃に|合わせて|攻める技。|エペでは|先に|当たれば|有効。|フルーレと|サーブルでは|攻撃側に|優先権が|あるので|通りにくい。'],
  recover:['攻撃のあとのすき', '届かない|攻撃を|すると、|元の|構えに|戻る|までに|すきが|でき、|相手は|1歩|遠くからでも|攻められます。'],
  rear:  ['後方ライン', 'ピストの|後ろの|端を|両足で|越えると、|相手に|1点|入ります。'],
  corps: ['体がぶつかったら', '体が|ぶつかると|審判が|「アルト」で|止め、|構えから|やり直します。'],
  zen:   ['全身が有効面', 'エペは|頭から|足先まで|どこを|突いても|1本。|足や|手首も|狙えます。'],
  doji:  ['同時突き', 'エペには|優先権が|ありません。|ほぼ同時に|突けば|両方に|1点ずつ|入ります。'],
  dotai: ['有効面は胴体だけ', 'フルーレは|胴体だけが|有効面。|腕・|マスク・|足は|無効面です。'],
  white: ['白いランプ', 'フルーレで|無効面を|突くと|白い|ランプが|点き、|試合は|止まりますが|点は|入りません。'],
  prio:  ['優先権', '先に|攻撃を|始めた|側に|優先権が|あります。|両者が|当てても、|点が|入るのは|優先権の|ある側だけ。'],
  simul: ['同時攻撃', 'どちらにも|優先権が|ない|まま|同時に|攻撃すると、|どちらにも|点は|入りません。'],

// 白い競技着の選手(右向き)。pose: stand / lunge / parry / slash / extend / fleche
function fencerSVG(pose){
  const L = pose === 'lunge' || pose === 'slash', P = pose === 'parry', S = pose === 'slash', E = pose === 'extend', F = pose === 'fleche';
  const front = F ? [30,FLOOR-2] : L ? [44,FLOOR-2] : [20,FLOOR-2], back = F ? [56,FLOOR-24] : L ? [-34,FLOOR-2] : [-20,FLOOR-2];
  const hip = L ? [0,152] : F ? [10,146] : [0,148], sh = F ? [24,108] : [4,108];
  const hand = S ? [40,92] : (L || F) ? [50,112] : E ? [44,116] : P ? [30,104] : [30,124];
  const tip = S ? [98,128] : (L || F) ? [116,112] : E ? [104,108] : P ? [58,62] : [92,112];
  const knee = L ? [30,170] : F ? [20,172] : [14,172];
  const head = F ? 28 : 8;
  return `
    <ellipse cx="0" cy="${FLOOR}" rx="46" ry="5" fill="#000" opacity=".35"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M${hip} L${back[0]+6},172 L${back}" stroke="#8e959c" stroke-width="11"/>
      <path d="M${sh} L${sh[0]-20},104 L${sh[0]-28},${L?96:84}" stroke="#8e959c" stroke-width="8"/>
      <path d="M${hip} L${sh}" stroke="#d7dbdf" stroke-width="20"/>
      <path d="M${hip} L${knee} L${front}" stroke="#e4e7ea" stroke-width="12"/>
      <path d="M${front[0]-2},${FLOOR-1} h12" stroke="#f4f5f6" stroke-width="6"/>
      <path d="M${sh} L${hand}" stroke="#eceef0" stroke-width="9"/>
      <path d="M${hand} L${tip}" stroke="#c9ced3" stroke-width="${weapon==='sabre'?3:2}"/>
    </g>
    <circle cx="${hand[0]}" cy="${hand[1]}" r="5" fill="#9aa1a8"/>
    <ellipse cx="${head}" cy="88" rx="12" ry="14" fill="#2a2e33" stroke="#e6e9ec" stroke-width="2"/>
    <path d="M${head-6} 82h12M${head-6} 88h13M${head-6} 94h12" stroke="#5a6067" stroke-width="1"/>`;
}

// 剣先の軌跡。右向き基準の座標を、相手側は左右反転して描く
function trail(side, kind){
  const fx = document.getElementById('fx'), base = X(side==='me'?st.me:st.cpu), dir = side==='me'?1:-1;
  const P = (x,y) => `${base + dir*x},${y}`;
  const cut = weapon === 'sabre' && st.cut[side];
  const paths = {
    atk: cut ? `M${P(0,40)} C${P(70,10)} ${P(130,70)} ${P(100,132)}` : `M${P(-10,70)} C${P(30,40)} ${P(70,128)} ${P(118,112)}`,
    cnt: `M${P(20,124)} L${P(116,110)}`,
    fle: `M${P(-120,118)} C${P(-40,100)} ${P(40,120)} ${P(120,112)}`,
    fei: `M${P(30,122)} L${P(78,112)} L${P(60,116)}`,
    par: `M${P(92,118)} C${P(140,80)} ${P(110,30)} ${P(60,56)} C${P(20,80)} ${P(50,130)} ${P(96,108)}`,
    adv: `M${P(-60,FLOOR-6)} L${P(30,FLOOR-6)}`,
    ret: `M${P(40,FLOOR-6)} L${P(-50,FLOOR-6)}`,
  };
  const g = document.createElementNS(NS,'g');
  const w = kind==='adv'||kind==='ret' ? [5,1.2] : kind==='fei' ? [6,1.6] : [9,2.2];
  g.innerHTML = `
    <path class="trail" pathLength="1" d="${paths[kind]}" stroke="${COL[side]}" stroke-width="${w[0]}" opacity=".55" filter="url(#glow)"/>
    <path class="trail" pathLength="1" d="${paths[kind]}" stroke="#ffffff" stroke-width="${w[1]}"/>`;
  if (ATTACKS.has(kind) || kind==='par'){
    const [ex,ey] = kind==='par' ? [96,108] : cut && kind==='atk' ? [100,128] : [116,112];
    for (let i=0;i<7;i++){ const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx', base + dir*(ex + (Math.random()*40-12))); c.setAttribute('cy', ey + Math.random()*40-20);
      c.setAttribute('r', (Math.random()*1.6+.6).toFixed(1)); c.setAttribute('fill', '#ffffff'); c.setAttribute('class','spark'); g.appendChild(c); }
  }
  fx.appendChild(g);
}

// 攻撃が体のどこに当たったか。種目の有効面かどうかも返す
function landHit(){
  const w = PART_W[weapon], sum = w.reduce((a,b)=>a+b);
  let r = Math.random() * sum, i = 0;
  while ((r -= w[i]) > 0) i++;
  const [part, y, kind] = PARTS[i];
  return {part, y, valid: VALID[weapon](kind)};
}

// 直近6手の癖。相手はこれを見て攻め方を変える
const rate = k => st.hist.length < 3 ? 0 : st.hist.filter(x => x === k).length / st.hist.length;
function cpuChoose(){
  const d = st.cpu - st.me;
  let w = d >= 4 ? {adv:50, ret:8, atk:6, par:16, fei:6, fle:d <= 5 ? 12 : 0, cnt:4}
        : d >= 2 ? {adv:14, ret:20, atk:26, par:18, fei:12, fle:4, cnt:10}
        :          {adv:4, ret:30, atk:30, par:16, fei:8, fle:0, cnt:14};
  if (weapon === 'sabre') w.fle = 0;                       // 相手は反則をしない
  // 同じ手ばかり押していると、相手はそれに強い手を増やす(ワンパターンでは勝てない)
  const ANSWER = {atk:['par','ret'], cnt:[W().prio ? 'atk' : 'par', 'par'], par:['fei','adv'], fei:['atk','cnt'],
                  adv:['cnt','atk'], ret:['adv','fle'], fle:['par','ret']};
  for (const k in ANSWER){
    const r = rate(k);
    if (r < .4) continue;
    const [best, second] = ANSWER[k];
    w[best] += 90 * r; w[second] += 30 * r; w[k] = Math.max(2, w[k] * .3);
    if (k === 'par') w.atk = Math.min(w.atk, 6);            // パラード待ちには素直に攻めない
  }
  if (st.recov.me) { w.atk += 70; w.cnt += 10; w.par = Math.max(4, w.par * .5); w.adv *= .3; }   // 戻りのすきを突く
  if (st.recov.cpu) { w.par += 20; w.ret += 20; }
  if (weapon === 'sabre') w.fle = 0;
  if (st.cpu >= END - 1) { w.ret = 3; w.par += 10; }
  let r = Math.random() * Object.values(w).reduce((a,b)=>a+b), k;
  for (k in w) { r -= w[k]; if (r < 0) break; }
  return k;
}
function setHint(){
  st.next = cpuChoose();
  const keys = Object.keys(ACT).filter(k => !(weapon === 'sabre' && k === 'fle'));
  const shown = Math.random() < .7 ? st.next : keys.filter(k=>k!==st.next)[Math.floor(Math.random()*(keys.length-1))];
  document.getElementById('hint').innerHTML = t(TELL[shown]);
  document.getElementById('dist').textContent = `間合い ${st.cpu - st.me}m`;
}

function ref(title, body, ruleKey, log, cont, who){
  let h = '';

  h += `<h2>${who ? TRI(COL[who]) : ''}${t(title)}</h2><p>${t(body)}</p>`;
  if (ruleKey){
    const isNew = !learned().has(ruleKey);
    learned().add(ruleKey);
    h += `<div class="rule"><em>${isNew?'新しいルール':'ルール'}</em><b>${RULES[ruleKey][0]}</b> ${t(RULES[ruleKey][1])}</div>`;
    renderBook();
  }
  document.getElementById('ref').innerHTML = h;
  const next = document.getElementById('next');
  const show = b => { document.getElementById('acts1').hidden = document.getElementById('acts2').hidden = !b; next.hidden = b; };

    const again = cont === 'もう一度';
    next.innerHTML = again ? '<b>もう一試合</b><span>スコアを0に戻して最初から</span>'
                           : '<b>次の1本へ</b><span>両者とも構えの線に戻って再開します</span>';
    next.onclick = again ? newGame : resetGuard;
    show(false); next.focus({preventScroll:true});
  } else show(true);
}
function renderBook(){
  const keys = W().book;
  document.getElementById('book').innerHTML = keys.map(k =>
    learned().has(k) ? `<li><b>${RULES[k][0]}</b>${t(RULES[k][1])}</li>` : `<li class="locked"><b>まだ見ていない</b>試合の中で解放されます</li>`).join('');
  document.getElementById('bookTitle').textContent = `覚えたルール(${W().name})`;
  document.getElementById('bookCount').textContent = `${keys.filter(k=>learned().has(k)).length} / ${keys.length}`;
}
function setBusy(b){ st.busy = b; document.querySelectorAll('.act').forEach(e=>e.disabled=b); }
function call(s){ document.getElementById('call').textContent = s; }
const firstNew = (...keys) => keys.find(k => !learned().has(k)) || null;

function play(a){
  if (st.busy || st.over) return;
  const c = st.next, d = st.cpu - st.me, PRIO = W().prio, act = {me:a, cpu:c};
  st.cut = {me: Math.random() < .75, cpu: Math.random() < .75};   // サーブルは斬りが中心
  const log = `あなた:${actName(a,'me')} / 相手:${actName(c,'cpu')}`;
  setBusy(true); clearFx(); call(''); lamps(false,false); toast('');
  st.hist = [...st.hist, a].slice(-6);

  // 移動を先に反映(攻撃・パラード・フェイントはその場)。届くかどうかは、守る側が動いた後の間合いで決まる
  let me = st.me + (a==='adv'?1:a==='ret'?-1:0);
  let cpu = st.cpu + (c==='adv'?-1:c==='ret'?1:0);
  const outMe = me < -END, outCpu = cpu > END;
  const rn = cpu - me;
  // 相手が前の攻撃の戻り中なら、1歩遠くからでも届く
  const inReach = (k, s) => (REACH[k] || 0) + (st.recov[other(s)] ? 1 : 0) >= Math.max(rn, 1);
  const bump = rn < 1;
  if (bump) { me = st.me; cpu = st.cpu; }
  // フレッシュは走り込むので、終わった後は相手の近くまで進む
  if (a === 'fle') me = Math.min(me + 2, cpu - 1);
  if (c === 'fle') cpu = Math.max(cpu - 2, me + 1);
  st.me = Math.max(me, -END - 1); st.cpu = Math.min(cpu, END + 1);
  const pose = (k, s) => k==='atk' ? (weapon==='sabre' && st.cut[s] ? 'slash' : 'lunge') : k==='cnt' ? 'lunge'
                       : k==='fle' ? 'fleche' : k==='fei' ? 'extend' : k==='par' ? 'parry' : 'stand';
  draw(pose(a,'me'), pose(c,'cpu'));
  trail('me', a); trail('cpu', c); techLabel('me', a); techLabel('cpu', c);

  setTimeout(() => {
    // touch=true なら1本(またはアルト)で構えに戻る。false なら同じ位置のまま続行
    let pts = {me:0, cpu:0}, title, body = '', rule = null, who = null, touch = false;
    const verb = s => weapon === 'sabre' ? (st.cut[s] ? '斬られた' : '突かれた') : '突かれた';
    const validRule = () => weapon==='epee' ? firstNew('zen') : weapon==='foil' ? firstNew('dotai') : firstNew('kiri','jouhan');
    const offTarget = (atkSide, r) => {
      st.prio = null;
      if (weapon === 'foil'){
        whiteLamp(atkSide); burst(other(atkSide), r.y, '#ffffff'); call('アルト');
        title = `${r.part}は|無効面`;
        body = '白い|ランプが|点きました。|フルーレは|胴体だけが|有効面なので、|点は|入りません。|その場から|再開します。';
        rule = firstNew('white','dotai');
      } else {
        title = `${r.part}に|当たったが|記録されず`;
        body = 'サーブルは|腰より|下が|無効面。|ランプは|点かず、|そのまま|続行です。';
        rule = 'noreg';
      }
    };
    // 1人の攻撃が当たったときの処理。extra は状況の説明
    const hit = (A, extra, ruleKey) => {
      const r = landHit();
      if (!r.valid) return offTarget(A, r);
      pts[A] = 1; touch = true; who = A; burst(other(A), r.y);
      title = A==='me' ? `${r.part}に|命中。|あなたに|1点` : `${r.part}を|${verb(A)}。|相手に|1点`;
      body = extra || '';
      rule = ruleKey || validRule();
    };
    // 両者の攻撃が同時に届いたとき
    const simultaneous = () => {
      if (!PRIO){
        pts.me = pts.cpu = 1; touch = true; burst('me', 122); burst('cpu', 122);
        title = '同時突き。|両者に|1点'; body = '2つの|ランプが|同時に|点きました。'; rule = 'doji';
      } else if (st.prio){
        const h = st.prio, r = landHit();
        if (!r.valid) return offTarget(h, r);
        pts[h] = 1; touch = true; who = h; burst(other(h), r.y); lamps(true, true);
        title = `優先権の|ある|${NAME[h]}に|1点`;
        body = `ランプは|2つ|点きましたが、|先に|攻め始めた|${NAME[h]}に|優先権が|あったので、|点は|${NAME[h]}だけ。(${r.part}に|命中)`;
        rule = 'prio';
      } else {
        st.prio = null; lamps(true, true); burst('me', 122); burst('cpu', 122); call('アルト');
        title = '同時攻撃。|点は|なし';
        body = 'ランプは|2つ|点きましたが、|どちらにも|優先権が|ない|まま|同時に|攻撃したので、|どちらにも|点は|入りません。';
        rule = 'simul';
      }
    };
    const fleFoul = weapon === 'sabre' ? ['me','cpu'].filter(s => act[s] === 'fle') : [];

    if (outMe || outCpu){
      if (outMe) pts.cpu = 1; if (outCpu) pts.me = 1; touch = true;
      title = outCpu ? '相手が|後ろの|端を|越えた' : 'あなたが|後ろの|端を|越えた';
      body = outCpu ? '下がりすぎた|相手の|反則。|あなたに|1点。' : '下がりすぎて|ピストの|外へ。|相手に|1点。';
      rule = 'rear'; who = outCpu ? 'me' : 'cpu';
    } else if (fleFoul.length){
      const s = fleFoul[0]; st.cards[s]++; touch = true; call('アルト');
      if (st.cards[s] >= 2){ pts[other(s)] = 1; who = other(s);
        title = `レッドカード。|${NAME[other(s)]}に|1点`; body = 'サーブルで|2回目の|フレッシュ。|反則で|相手に|1点が|入ります。'; }
      else { title = 'イエローカード(警告)'; body = 'サーブルでは|フレッシュ(走り込み)は|禁止です。|次は|レッドカードで|相手に|1点。'; }
      rule = 'flefoul';
    } else if (ATTACKS.has(a) && ATTACKS.has(c)){
      const rMe = inReach(a,'me'), rCpu = inReach(c,'cpu');
      if (!rMe && !rCpu){
        st.prio = null;
        title = '両者とも|空振り'; body = `間合いが|${rn}mあり、|どちらの|攻撃も|届きませんでした。`; rule = 'maai';
      } else if (rMe !== rCpu){
        const A = rMe ? 'me' : 'cpu';
        hit(A, `${NAME[other(A)]}の|攻撃は|届かず、|${NAME[A]}の|${actName(act[A],A)}だけが|届きました。`);
      } else if (st.recov.me !== st.recov.cpu){
        const N = st.recov.me ? 'cpu' : 'me';
        hit(N, `${NAME[other(N)]}は|前の|攻撃の|戻りが|遅れ、|${NAME[N]}の|攻撃が|先に|届きました。`, firstNew('recover'));
      } else if ((a === 'cnt') !== (c === 'cnt')){
        const K = a === 'cnt' ? 'me' : 'cpu', A = other(K);
        if (!PRIO){
          if (Math.random() < .5){ hit(K, 'カウンターが|先に|届きました。|エペは|先に|当てた|方の|1本です。', 'counter'); }
          else { simultaneous(); body = 'カウンターと|攻撃が|ほぼ|同時に|当たりました。'; }
        } else {
          const r = landHit();
          if (!r.valid) offTarget(A, r);
          else { pts[A] = 1; touch = true; who = A; burst(K, r.y); lamps(true, true);
            title = `攻撃側の|${NAME[A]}に|1点`;
            body = 'カウンターも|当たりましたが、|先に|攻撃を|始めた|側に|優先権が|あるので、|カウンターは|数えられません。';
            rule = 'counter'; }
        }
      } else simultaneous();
    } else if (ATTACKS.has(a) || ATTACKS.has(c)){
      const A = ATTACKS.has(a) ? 'me' : 'cpu', D = other(A), k = act[A], def = act[D];
      if (!inReach(k, A)){
        title = `${NAME[A]}の|${actName(k,A)}は|届かず`;
        body = `間合いが|${rn}mあり、|届きませんでした。|${NAME[A]}は|戻るまで|すきが|できます。`;
        rule = firstNew('maai','recover') || 'maai';
        if (PRIO){ st.prio = D; body += `|優先権は|${NAME[D]}に|移ります。`; rule = firstNew('maai','recover','pass') || 'pass'; }
      } else if (def === 'par' && Math.random() >= (k === 'fle' ? .1 : PARRY_FAIL)){
        pts[D] = 1; touch = true; who = D; burst(A, 122);
        title = A==='me' ? 'パラードされ、|相手の|リポスト' : 'パラード成功、|あなたの|リポスト';
        body = A==='me' ? '攻撃を|払われ、|すぐに|返されました。' : '相手の|攻撃を|払って、|すぐに|返しました。';
        if (k === 'fle') body += '|フレッシュは|勢いが|あるぶん、|払われると|立て直せません。';
        if (PRIO) body += '|払った|瞬間に|優先権は|払った側へ|移ります。';
        rule = PRIO ? firstNew('parry','pass') || 'parry' : 'parry';
      } else {
        let extra = def === 'par' ? 'パラードが|間に合わず、|払い損ねました。'
          : def === 'fei' ? 'フェイントの|最中で、|守りが|空いていました。'
          : k === 'cnt' && def === 'adv' ? '前に|出てくる|ところを|カウンターで|捉えました。'
          : k === 'fle' ? '走り込んで|遠くから|届きました。'
          : def === 'adv' ? '前に|出た|ところを|捉えました。'
          : def === 'ret' ? '下がっても|まだ|届く|間合いでした。' : '';
        const rk = st.recov[D] ? firstNew('recover') : k === 'fle' ? firstNew('fleche') : k === 'cnt' ? firstNew('counter') : null;
        if (st.recov[D] && !extra.includes('パラード')) extra = `${NAME[D]}の|攻撃の|戻りの|すきを|突きました。`;
        hit(A, extra, rk);
      }
    } else if (a === 'fei' || c === 'fei'){
      const F = a === 'fei' ? 'me' : 'cpu', D = other(F), def = act[D];
      if (a === 'fei' && c === 'fei'){
        title = 'お互いに|フェイント'; body = 'どちらも|ふりだけで、|何も|起きませんでした。';
      } else if (def === 'par' && inReach('fei', F)){
        hit(F, F==='me' ? 'フェイントで|相手の|パラードを|空振りさせ、|空いた|ところを|攻めました。'
                        : '攻撃の|ふりに|パラードを|空振りさせられ、|空いた|ところを|攻められました。' +
                          (rate('par') >= .4 ? '|パラードばかりで|読まれています。|前進や|攻撃も|混ぜましょう。' : ''), 'feint');
        if (touch) title = F==='me' ? 'フェイント成功。|あなたに|1点' : 'フェイントに|かかった。|相手に|1点';
      } else {
        title = `${NAME[F]}の|フェイントは|空振り`;
        body = inReach('fei', F) ? `${NAME[D]}が|パラードしなかったので、|誘いは|効きませんでした。` : '間合いが|遠く、|誘いに|なりませんでした。';
        rule = firstNew('feint');
      }
    } else if (bump){
      touch = true; st.prio = null;
      title = 'アルト(止め)'; body = '体が|ぶつかりそうに|なったので|審判が|止めました。'; rule = 'corps';
    } else {
      // 移動だけの手。フルーレ・サーブルは、先に前へ出た側が優先権を持つ
      title = '探り合い';
      body = `間合いは|${st.cpu-st.me}mに|なりました。`;
      if (PRIO){
        const before = st.prio;
        if (a==='adv' && c!=='adv') st.prio = 'me';
        else if (c==='adv' && a!=='adv') st.prio = 'cpu';
        else if (a==='adv' && c==='adv') st.prio = null;
        if ((st.prio==='me' && a==='ret') || (st.prio==='cpu' && c==='ret')) st.prio = null;
        if (st.prio !== before){
          body += st.prio ? `|先に|前へ|出て|攻め始めた|${NAME[st.prio]}に|優先権が|移りました。` : '|優先権は|どちらにも|ありません。';
          rule = firstNew('prio');
        }
      }
      body += '|相手の|気配を|見て|次の|手を|選びましょう。';
    }

    toast(title);
    // 届かない攻撃をした側は、次の手まで戻りのすきが残る
    st.recov = {me: !touch && ATTACKS.has(a) && !inReach(a,'me'), cpu: !touch && ATTACKS.has(c) && !inReach(c,'cpu')};
    if (!touch){
      st.turn++; draw(); setHint(); setBusy(false);
      ref(title, body, rule, log);
      return;
    }
    st.sMe += pts.me; st.sCpu += pts.cpu;
    if (pts.me || pts.cpu) lamps(pts.me>0 || document.getElementById('lampMe').classList.contains('lit'), pts.cpu>0 || document.getElementById('lampCpu').classList.contains('lit'));
    call('アルト');
    draw(pose(a,'me'), pose(c,'cpu'));
    if (st.sMe >= 5 && st.sMe === st.sCpu) body = (body ? body + '|' : '') + '同点なので、|このゲームでは|どちらかが|リードするまで|続けます。';
    if ((st.sMe >= 5 || st.sCpu >= 5) && st.sMe !== st.sCpu){
      st.over = true;
      const win = st.sMe > st.sCpu ? 'あなたの|勝ち' : '相手の|勝ち';
      toast(`${win} ${st.sMe}-${st.sCpu}`);
      ref(`${win} ${st.sMe}-${st.sCpu}`, `${title.replace(/\|/g,'')}。|本番は|15本先取で|行います。`, rule, log, 'もう一度', who);
    } else {
      ref(title, body || ' ', rule, log, '構えに戻る', who);
    }
  }, 480);
}

function resetGuard(){
  st.me = -START; st.cpu = START; st.turn++; st.prio = null; st.recov = {me:false, cpu:false};
  lamps(false,false); call('アン・ガルド'); clearFx(); toast('');
  draw(); setHint(); setBusy(false);
  ref('構えから|再開', '1本|入るたびに|両者は|構えの線に|戻ります。' + (W().prio ? '|優先権も|リセットされます。' : '') + '|プレ?|アレ!');
}

document.querySelectorAll('.act').forEach(b => b.onclick = () => play(b.dataset.a));
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setWeapon(b.dataset.w));
setWeapon('epee');
</script>
