<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ピスト道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap">
<style>
/* 暗い競技場の舞台。白黒の選手と、剣先の軌跡だけが光る。採点器は実物どおり赤と緑のランプとLED数字。単一の暗い世界観で固定 */
:root{
  --stage:#06080b; --deck:#0c1015; --hair:rgba(220,230,240,.14); --hair2:rgba(220,230,240,.28);
  --ink:#dfe4e9; --muted:#7f8a95; --white:#f2f4f6;
  --trail-me:#9eeeff; --trail-cpu:#ff74d4; --lamp-red:#ff2e2e; --lamp-green:#22e06a; --led:#ff4a35;
  --stagelight:#3d6dff; --line:#b8673d;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"Consolas",monospace;
  color-scheme:dark;
}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-weight:400;font-size:15px;line-height:1.75;
  line-break:strict;overflow-wrap:break-word;}
.pb{word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;
  border-bottom:1px solid var(--hair);padding-bottom:12px}
h1{font-weight:300;font-size:26px;letter-spacing:.32em;margin:0;line-height:1.3;color:var(--white)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tabs{display:flex;gap:18px}
.tab{background:none;border:0;padding:2px 0;font:inherit;font-size:13px;letter-spacing:.2em;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--white);box-shadow:inset 0 -1px 0 var(--trail-me)}
.tab[disabled]{opacity:.45}

/* 舞台 */
.stagebox{border:1px solid var(--hair);background:var(--deck)}
svg{display:block;width:100%;height:auto}
.fencer{transition:transform .35s ease}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw .42s ease-out forwards, fade 1.6s .9s ease-in forwards}
.spark{animation:fade 1.4s .5s ease-in forwards}
.tech{font-family:var(--body);font-weight:300;font-size:15px;letter-spacing:.18em;fill:var(--ink);animation:fade 2.2s 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
.call{font-weight:300;font-size:20px;letter-spacing:.4em;fill:var(--white)}
.tag{font-size:11px;letter-spacing:.2em;fill:var(--muted)}

/* 採点器 */
.box{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  background:#000;border:1px solid var(--hair2);padding:10px 14px;max-width:520px;width:100%;margin:-4px auto 0}
.side{display:flex;align-items:center;gap:12px}
.side.r{justify-content:flex-end}
.lamp{width:34px;height:24px;background:#1a1d21;flex:none;transition:background .12s,box-shadow .12s}
.lamp.red.lit{background:var(--lamp-red);box-shadow:0 0 22px var(--lamp-red)}
.lamp.green.lit{background:var(--lamp-green);box-shadow:0 0 22px var(--lamp-green)}
.who{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.led{font-family:var(--mono);font-size:34px;line-height:1;color:var(--led);text-shadow:0 0 10px rgba(255,74,53,.55);font-variant-numeric:tabular-nums}
.mid{text-align:center;font-size:11px;color:var(--muted);line-height:1.5;letter-spacing:.08em}
.mid .led{font-size:18px;display:block}

.hint{display:flex;gap:14px;align-items:baseline;font-size:14px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:10px 2px}
.hint .k{font-size:11px;letter-spacing:.24em;color:var(--trail-cpu);white-space:nowrap}
.hint .d{margin-left:auto;font-family:var(--mono);color:var(--muted);white-space:nowrap}

/* 行動 */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
.act{font:inherit;border:0;background:var(--stage);color:var(--ink);padding:14px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0;transition:background .15s,color .15s}
.act b{font-weight:400;font-size:16px;letter-spacing:.14em;white-space:nowrap}
.act span{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.act svg{width:14px;height:14px}
.act:hover{background:#0f141a;color:var(--white)}
.act:hover svg path{stroke:var(--trail-me)}
.act:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:1px solid var(--trail-me);outline-offset:-3px}
.act:disabled{opacity:.35;cursor:default}
@media (max-width:420px){.act b{font-size:14px;letter-spacing:.06em}.led{font-size:28px}.lamp{width:26px;height:20px}h1{font-size:22px;letter-spacing:.24em}}

/* 審判 */
.ref{padding:4px 2px}
.ref .log{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.ref h2{font-weight:400;font-size:19px;letter-spacing:.06em;margin:4px 0 4px;text-wrap:balance;color:var(--white);display:flex;gap:10px;align-items:baseline}
.ref h2 svg{width:14px;height:14px;flex:none;transform:translateY(1px)}
.ref p{margin:0;color:var(--ink)}
.ref .rule{margin-top:10px;font-size:13px;border-left:1px solid var(--trail-me);padding:2px 0 2px 12px;color:var(--ink)}
.ref .rule em{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--trail-me);display:block}
.btn{font:inherit;font-size:13px;letter-spacing:.2em;border:1px solid var(--hair2);background:none;color:var(--white);padding:8px 22px;margin-top:14px;cursor:pointer}
.btn:hover{border-color:var(--trail-me);color:var(--trail-me)}

/* ルール帳 */
.book h3{font-weight:400;font-size:12px;letter-spacing:.28em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.book h3 span{font-family:var(--mono);letter-spacing:.05em}
.book ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));border-top:1px solid var(--hair)}
.book li{border-bottom:1px solid var(--hair);padding:10px 4px;font-size:13px;line-height:1.6;color:var(--ink)}
.book li b{display:block;font-weight:400;font-size:14px;letter-spacing:.08em;color:var(--white)}
.book li.locked{color:var(--muted)}
.book li.locked b{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fencer,.lamp{transition:none}.trail{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>ピスト道場</h1>
      <div class="sub pb">遊びながら<wbr>フェンシングの<wbr>ルールを<wbr>覚える</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" aria-selected="true">エペ</button>
      <button class="tab" disabled>フルーレ</button>
      <button class="tab" disabled>サーブル</button>
    </div>
  </header>

  <div class="stagebox">
    <svg viewBox="0 0 700 250" role="img" aria-label="ピストと2人の選手">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9ced3"/><stop offset="1" stop-color="#8d939a"/>
        </linearGradient>
        <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#050608"/>
        </linearGradient>
      </defs>
      <rect width="700" height="250" fill="url(#screen)"/>
      <!-- 天井の照明 -->
      <g id="lights" filter="url(#soft)" fill="var(--stagelight)" opacity=".8"></g>
      <line x1="0" y1="22" x2="700" y2="22" stroke="var(--hair2)"/>
      <line x1="40" y1="128" x2="660" y2="128" stroke="var(--hair)"/>
      <!-- ピスト(14m)。手前に少し傾けて舞台に見せる -->
      <polygon points="14,196 686,196 700,214 0,214" fill="url(#deck)"/>
      <rect x="0" y="214" width="700" height="4" fill="#41464c"/>
      <g stroke="var(--line)" stroke-width="2">
        <line x1="350" y1="196" x2="350" y2="214"/>
        <line x1="256" y1="196" x2="254" y2="214"/>
        <line x1="444" y1="196" x2="446" y2="214"/>
        <line x1="114" y1="196" x2="108" y2="214" opacity=".6"/>
        <line x1="586" y1="196" x2="592" y2="214" opacity=".6"/>
        <line x1="21" y1="196" x2="7" y2="214" stroke-width="3"/>
        <line x1="679" y1="196" x2="693" y2="214" stroke-width="3"/>
      </g>
      <g class="tag" text-anchor="middle" font-family="var(--body)">
        <text x="350" y="236">中央線</text>
        <text x="255" y="236">構えの線</text>
        <text x="445" y="236">構えの線</text>
        <text x="60" y="236">後方2m</text>
        <text x="640" y="236">後方2m</text>
      </g>
      <text id="call" class="call" x="350" y="58" text-anchor="middle">アン・ガルド</text>
      <g id="fMe" class="fencer"></g>
      <g id="fCpu" class="fencer"></g>
      <text id="tagMe" class="tag" y="118" text-anchor="middle">あなた</text>
      <text id="tagCpu" class="tag" y="118" text-anchor="middle">相手</text>
      <g id="fx"></g>
    </svg>
  </div>

  <div class="box" aria-live="polite">
    <div class="side"><div class="lamp red" id="lampMe"></div><div><div class="who">あなた</div><div class="led" id="sMe">0</div></div></div>
    <div class="mid"><span class="led" id="turnNo">01</span>5本先取</div>
    <div class="side r"><div style="text-align:right"><div class="who">相手</div><div class="led" id="sCpu">0</div></div><div class="lamp green" id="lampCpu"></div></div>
  </div>

  <div class="hint"><span class="k">相手の気配</span><span id="hint" class="pb"></span><span class="d" id="dist"></span></div>

  <div class="acts">
    <button class="act" data-a="adv"><svg viewBox="0 0 14 14"><path d="M3 2l8 5-8 5" fill="none" stroke="var(--muted)"/></svg><b>前進</b><span>+1m</span></button>
    <button class="act" data-a="ret"><svg viewBox="0 0 14 14"><path d="M11 2L3 7l8 5" fill="none" stroke="var(--muted)"/></svg><b>後退</b><span>−1m</span></button>
    <button class="act" data-a="atk"><svg viewBox="0 0 14 14"><path d="M1 7h12M9 3l4 4-4 4" fill="none" stroke="var(--muted)"/></svg><b>突き</b><span>≤3m</span></button>
    <button class="act" data-a="par"><svg viewBox="0 0 14 14"><path d="M2 2l5 10 5-10z" fill="none" stroke="var(--muted)"/></svg><b>パラード</b><span>受け→反撃</span></button>
  </div>

  <section class="ref" id="ref"></section>

  <section class="book">
    <h3>覚えたルール<span id="bookCount"></span></h3>
    <ul id="book"></ul>
  </section>
  <p class="note pb">モック版です。<wbr>相手の気配は<wbr>7割の確率で<wbr>本当の動きを<wbr>示します。<wbr>間合いは<wbr>1m単位に<wbr>簡略化しています。</p>
</div>

<script>
const t = s => `<span class="pb">${s.split('|').join('<wbr>').replace(/{(.+?)}/g,'<span style="white-space:nowrap">$1</span>')}</span>`;
const X = m => 350 + m * 47;           // ピスト上の位置(m)→ 画面のx座標
const START = 2, END = 7, REACH = 3, FLOOR = 196;
const NS = 'http://www.w3.org/2000/svg';
const COL = {me:'var(--trail-me)', cpu:'var(--trail-cpu)'};
const TRI = c => `<svg viewBox="0 0 14 14"><path d="M1 2h12L7 13z" fill="none" stroke="${c}"/><path d="M4.5 4h5L7 9z" fill="none" stroke="${c}" opacity=".6"/></svg>`;

const RULES = {
  maai:  ['間合い', 'エペの|突きは|およそ|3mまで。|遠い|ところから|突いても|届きません。'],
  zen:   ['全身が有効面', 'エペは|頭から|足先まで|どこを|突いても|1本。|足や|手首も|狙えます。'],
  doji:  ['同時突き', 'エペには|優先権が|ありません。|ほぼ同時に|突けば|両方に|1点ずつ|入ります。'],
  parry: ['パラード・リポスト', '相手の|剣を|払って(パラード)、|すぐ|突き返す(リポスト)と|1本。'],
  rear:  ['後方ライン', 'ピストの|後ろの|端を|両足で|越えると、|相手に|1点|入ります。'],
  corps: ['体がぶつかったら', '体が|ぶつかると|審判が|「アルト」で|止め、|構えから|やり直します。'],
};
const ACT = {adv:'前進', ret:'後退', atk:'突き', par:'パラード'};
const TECH = {adv:'マルシェ', ret:'ロンペ', atk:'ファント', par:'パラード'};
const TELL = {adv:'足が|前に|出たがっている', ret:'重心が|後ろに|乗っている', atk:'剣を|持つ|腕に|力が|入っている', par:'剣先が|少し|上がっている'};
const PARTS = [['足',182],['太もも',158],['胸',122],['腕',112],['マスク',86]];

// 天井の照明
(() => { const g = document.getElementById('lights');
  for (let i = 0; i < 9; i++){ const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx', 50 + i*75); c.setAttribute('cy', 12); c.setAttribute('r', 7); g.appendChild(c); } })();

let st;
function newGame(){
  st = {me:-START, cpu:START, sMe:0, sCpu:0, turn:1, learned:new Set(), busy:false, over:false};
  draw(); setHint(); renderBook(); lamps(false,false); setBusy(false); call('アン・ガルド'); clearFx();
  ref('構えて、はじめ', '{アン・ガルド(構え)}、|{プレ?(用意はいい?)}、|{アレ!(はじめ)}。|行動を|1つ|選んでください。|相手も|同時に|動きます。');
}

// 白い競技着の選手(右向き)。pose: stand / lunge / parry
function fencerSVG(pose){
  const L = pose === 'lunge', P = pose === 'parry';
  const front = L ? [44,FLOOR-2] : [20,FLOOR-2], back = L ? [-34,FLOOR-2] : [-20,FLOOR-2];
  const hip = L ? [0,152] : [0,148], sh = [4,108];
  const hand = L ? [46,112] : P ? [30,104] : [30,124];
  const tip = L ? [112,112] : P ? [58,62] : [92,112];
  const knee = L ? [30,170] : [14,172];
  return `
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M${hip} L${back[0]+6},172 L${back}" stroke="#8e959c" stroke-width="11"/>
      <path d="M${sh} L-16,104 L-24,${L?96:84}" stroke="#8e959c" stroke-width="8"/>
      <path d="M${hip} L${sh}" stroke="#d7dbdf" stroke-width="20"/>
      <path d="M${hip} L${knee} L${front}" stroke="#e4e7ea" stroke-width="12"/>
      <path d="M${front[0]-2},${FLOOR-1} h12" stroke="#f4f5f6" stroke-width="6"/>
      <path d="M${back[0]-8},${FLOOR-1} h12" stroke="#c2c7cc" stroke-width="6"/>
      <path d="M${sh} L${hand}" stroke="#eceef0" stroke-width="9"/>
      <path d="M${hand} L${tip}" stroke="#b9bfc5" stroke-width="2"/>
    </g>
    <circle cx="${hand[0]}" cy="${hand[1]}" r="5" fill="#9aa1a8"/>
    <ellipse cx="8" cy="88" rx="12" ry="14" fill="#2a2e33" stroke="#e6e9ec" stroke-width="2"/>
    <path d="M2 82h12M2 88h13M2 94h12" stroke="#5a6067" stroke-width="1"/>`;
}
const TIP = {stand:[92,112], lunge:[112,112], parry:[58,62]};

function draw(poseMe='stand', poseCpu='stand'){
  const fm = document.getElementById('fMe'), fc = document.getElementById('fCpu');
  fm.innerHTML = fencerSVG(poseMe); fc.innerHTML = fencerSVG(poseCpu);
  fm.style.transform = `translate(${X(st.me)}px,0)`;
  fc.style.transform = `translate(${X(st.cpu)}px,0) scale(-1,1)`;
  document.getElementById('tagMe').setAttribute('x', X(st.me));
  document.getElementById('tagCpu').setAttribute('x', X(st.cpu));
  document.getElementById('sMe').textContent = st.sMe;
  document.getElementById('sCpu').textContent = st.sCpu;
  document.getElementById('turnNo').textContent = String(st.turn).padStart(2,'0');
}

// 剣先の軌跡。右向き基準の座標を、相手側は左右反転して描く
function trail(side, kind){
  const fx = document.getElementById('fx'), base = X(side==='me'?st.me:st.cpu), dir = side==='me'?1:-1;
  const P = (x,y) => `${base + dir*x},${y}`;
  const paths = {
    atk: `M${P(-10,70)} C${P(30,40)} ${P(70,128)} ${P(118,112)}`,
    par: `M${P(92,118)} C${P(140,80)} ${P(110,30)} ${P(60,56)} C${P(20,80)} ${P(50,130)} ${P(96,108)}`,
    adv: `M${P(-60,FLOOR-6)} L${P(30,FLOOR-6)}`,
    ret: `M${P(40,FLOOR-6)} L${P(-50,FLOOR-6)}`,
  };
  const g = document.createElementNS(NS,'g');
  const w = kind==='adv'||kind==='ret' ? [5,1.2] : [9,2.2];
  g.innerHTML = `
    <path class="trail" pathLength="1" d="${paths[kind]}" stroke="${COL[side]}" stroke-width="${w[0]}" opacity=".55" filter="url(#glow)"/>
    <path class="trail" pathLength="1" d="${paths[kind]}" stroke="#ffffff" stroke-width="${w[1]}"/>`;
  if (kind==='atk'||kind==='par'){
    const [ex,ey] = kind==='atk' ? [118,112] : [96,108];
    for (let i=0;i<7;i++){ const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx', base + dir*(ex + (Math.random()*40-12))); c.setAttribute('cy', ey + Math.random()*40-20);
      c.setAttribute('r', (Math.random()*1.6+.6).toFixed(1)); c.setAttribute('fill', '#ffffff'); c.setAttribute('class','spark'); g.appendChild(c); }
  }
  fx.appendChild(g);
}
function techLabel(side, kind){
  const x = side==='me' ? 40 : 660;
  const g = document.createElementNS(NS,'g');
  g.innerHTML = `<text class="tech" x="${x}" y="${side==='me'?58:58}" text-anchor="${side==='me'?'start':'end'}">${TECH[kind]}</text>`;
  document.getElementById('fx').appendChild(g);
}
function burst(side, y){
  const x = side==='me' ? X(st.me)+8 : X(st.cpu)-8, c = side==='me' ? COL.cpu : COL.me;
  const g = document.createElementNS(NS,'g');
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${c}" stroke-width="3" filter="url(#glow)" class="spark"/>
    <circle cx="${x}" cy="${y}" r="4" fill="#fff" class="spark"/>`;
  document.getElementById('fx').appendChild(g);
}
function clearFx(){ document.getElementById('fx').innerHTML = ''; }

function cpuChoose(){
  const d = st.cpu - st.me;
  let w = d >= 4 ? {adv:55, ret:10, atk:10, par:25} : d >= 2 ? {adv:15, ret:25, atk:35, par:25} : {adv:5, ret:35, atk:40, par:20};
  if (st.cpu >= END - 1) { w.ret = 3; w.par += 10; }
  let r = Math.random() * Object.values(w).reduce((a,b)=>a+b), k;
  for (k in w) { r -= w[k]; if (r < 0) break; }
  return k;
}
function setHint(){
  st.next = cpuChoose();
  const keys = Object.keys(ACT);
  const shown = Math.random() < .7 ? st.next : keys.filter(k=>k!==st.next)[Math.floor(Math.random()*3)];
  document.getElementById('hint').innerHTML = t(TELL[shown]);
  document.getElementById('dist').textContent = `間合い ${st.cpu - st.me}m`;
}

function lamps(me, cpu){
  document.getElementById('lampMe').classList.toggle('lit', me);
  document.getElementById('lampCpu').classList.toggle('lit', cpu);
}
function ref(title, body, ruleKey, log, cont, who){
  let h = '';
  if (log) h += `<div class="log">${log}</div>`;
  h += `<h2>${who ? TRI(COL[who]) : ''}${t(title)}</h2><p>${t(body)}</p>`;
  if (ruleKey){
    const isNew = !st.learned.has(ruleKey);
    st.learned.add(ruleKey);
    h += `<div class="rule"><em>${isNew?'新しいルール':'ルール'}</em><b>${RULES[ruleKey][0]}</b> ${t(RULES[ruleKey][1])}</div>`;
    renderBook();
  }
  if (cont) h += `<button class="btn" id="cont">${cont}</button>`;
  document.getElementById('ref').innerHTML = h;
  if (cont) document.getElementById('cont').onclick = cont === 'もう一度' ? newGame : resetGuard;
}
function renderBook(){
  const ul = document.getElementById('book');
  ul.innerHTML = Object.entries(RULES).map(([k,[n,d]]) =>
    st.learned.has(k) ? `<li><b>${n}</b>${t(d)}</li>` : `<li class="locked"><b>まだ見ていない</b>試合の中で解放されます</li>`).join('');
  document.getElementById('bookCount').textContent = `${st.learned.size} / ${Object.keys(RULES).length}`;
}
function setBusy(b){ st.busy = b; document.querySelectorAll('.act').forEach(e=>e.disabled=b); }
function call(s){ document.getElementById('call').textContent = s; }

function play(a){
  if (st.busy || st.over) return;
  const c = st.next, d = st.cpu - st.me;
  const log = `あなた ${ACT[a]} / 相手 ${ACT[c]}`;
  setBusy(true); clearFx(); call('');

  // 移動を先に反映(突きとパラードはその場)
  let me = st.me + (a==='adv'?1:a==='ret'?-1:0);
  let cpu = st.cpu + (c==='adv'?-1:c==='ret'?1:0);
  let nd = cpu - me;
  const outMe = me < -END, outCpu = cpu > END;
  const reachNd = nd;  // 突いた側はその場なので、防いだ側が動いた後の間合いで届くか決まる
  const bump = nd < 1;
  if (bump) { me = st.me; cpu = st.cpu; nd = d; }
  st.me = Math.max(me, -END - 1); st.cpu = Math.min(cpu, END + 1);
  const pose = k => k==='atk'?'lunge':k==='par'?'parry':'stand';
  draw(pose(a), pose(c));
  trail('me', a); trail('cpu', c); techLabel('me', a); techLabel('cpu', c);

  setTimeout(() => {
    let pMe = 0, pCpu = 0, title, body, rule, who = null;
    if (outMe || outCpu){
      if (outMe) pCpu = 1; if (outCpu) pMe = 1;
      title = outCpu ? '相手が|後ろの|端を|越えた' : 'あなたが|後ろの|端を|越えた';
      body = outCpu ? '下がりすぎた|相手の|反則。|あなたに|1点。' : '下がりすぎて|ピストの|外へ。|相手に|1点。';
      rule = 'rear'; who = outCpu ? 'me' : 'cpu';
    } else if (a==='atk' && c==='atk'){
      if (d <= REACH){ pMe = pCpu = 1; title = '同時突き。|両者に|1点'; body = '2つの|ランプが|同時に|点きました。'; rule = 'doji';
        burst('me', 122); burst('cpu', 122); }
      else { title = '両者とも|空振り'; body = `間合いが|${d}mあり、|どちらの|突きも|届きませんでした。`; rule = 'maai'; }
    } else if (a==='atk' || c==='atk'){
      const atkMe = a==='atk', def = atkMe ? c : a;
      if (reachNd > REACH){
        title = atkMe ? 'あなたの|突きは|届かず' : '相手の|突きは|届かず';
        body = `間合いが|${reachNd}mあり、|剣先が|届きませんでした。`; rule = 'maai';
      } else if (def === 'par'){
        if (atkMe){ pCpu = 1; title = 'パラードされ、|相手の|リポスト'; body = '突きを|払われ、|すぐに|突き返されました。'; who = 'cpu'; burst('me', 122); }
        else { pMe = 1; title = 'パラード成功、|あなたの|リポスト'; body = '相手の|突きを|払って、|すぐに|突き返しました。'; who = 'me'; burst('cpu', 122); }
        rule = 'parry';
      } else {
        if (atkMe) pMe = 1; else pCpu = 1;
        const [part, y] = PARTS[Math.floor(Math.random()*PARTS.length)];
        burst(atkMe ? 'cpu' : 'me', y); who = atkMe ? 'me' : 'cpu';
        title = atkMe ? `${part}に|命中。|あなたに|1点` : `${part}を|突かれた。|相手に|1点`;
        body = def==='adv' ? (atkMe ? '前に|出てきた|ところを|突きました。' : '前に|出た|ところを|狙われました。')
                           : def==='ret' ? '下がっても|まだ|届く|間合いでした。' : '';
        rule = st.learned.has('zen') ? null : 'zen';
      }
    } else if (bump){
      title = 'アルト(止め)'; body = '体が|ぶつかりそうに|なったので|審判が|止めました。'; rule = 'corps';
    } else {
      st.turn++; draw(); setHint(); setBusy(false);
      ref('探り合い', `間合いは|${st.cpu-st.me}mに|なりました。|相手の|気配を|見て|次の|手を|選びましょう。`, null, log);
      return;
    }

    st.sMe += pMe; st.sCpu += pCpu;
    lamps(pMe>0, pCpu>0);
    call('アルト');
    draw(pose(a), pose(c));
    if (st.sMe >= 5 || st.sCpu >= 5){
      st.over = true;
      const win = st.sMe > st.sCpu ? 'あなたの|勝ち' : st.sMe < st.sCpu ? '相手の|勝ち' : '引き分け';
      ref(`${win} ${st.sMe}-${st.sCpu}`, `${title.replace(/\|/g,'')}。|本番は|15本先取、|3分×3ピリオドで|行います。`, rule, log, 'もう一度', who);
    } else {
      ref(title, body || ' ', rule, log, '構えに戻る', who);
    }
  }, 480);
}

function resetGuard(){
  st.me = -START; st.cpu = START; st.turn++;
  lamps(false,false); call('アン・ガルド'); clearFx();
  draw(); setHint(); setBusy(false);
  ref('構えから|再開', '1本|入るたびに|両者は|構えの線に|戻ります。|プレ?|アレ!');
}

document.querySelectorAll('.act').forEach(b => b.onclick = () => play(b.dataset.a));
newGame();
</script>
